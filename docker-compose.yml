services:
  # Base de Datos PostgreSQL
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: minipackettracerdb
    ports:
      - "5432:5432"
    volumes: 
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d minipackettracerdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Servidor de Service Discovery
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    ports:
      - "8500:8500"
    command: "agent -dev -client=0.0.0.0"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8500"]
      interval: 5s
      timeout: 5s
      retries: 3

  # Microservicio de Nodos (Registrado en Consul)
  service-nodos:
    build: ./p1_backend_nodos
    ports: 
      - "8081:8080"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=nodos-1
      - SERVICE_NAME=nodos
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy

  # Microservicio de Enlaces (Registrado en Consul)
  service-enlaces:
    build: ./p2_backend_enlaces
    ports: 
      - "8082:8080"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=enlaces-1
      - SERVICE_NAME=enlaces
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy

  # Microservicio de Envíos - Instancia 1 (Registrado en Consul)
  service-envios-1:
    build: ./p3_backend_envio
    ports:
      - "8083:8080"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=envios-1
      - SERVICE_NAME=envios
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy

  # Microservicio de Envíos - Instancia 2 (Registrado en Consul)
  service-envios-2:
    build: ./p3_backend_envio
    ports:
      - "8084:8080"
    environment:
      - CONSUL_HOST=consul
      - SERVICE_ID=envios-2
      - SERVICE_NAME=envios
    depends_on:
      db:
        condition: service_healthy
      consul:
        condition: service_healthy

  # API Gateway en Go (Dinámico con Consul)
  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      - CONSUL_HOST=consul
    depends_on:
      - consul

  # Capas de Nginx con Consul-Template (Alta Disponibilidad)
  nginx-gateway-1:
    build: ./nginx-gateway
    environment:
      - CONSUL_ADDR=consul:8500
    depends_on:
      - consul

  nginx-gateway-2:
    build: ./nginx-gateway
    environment:
      - CONSUL_ADDR=consul:8500
    depends_on:
      - consul

  # Balanceador de Carga HAProxy frente a los Nginx
  haproxy:
    build: ./haproxy
    ports:
      - "80:80"
    depends_on:
      - nginx-gateway-1
      - nginx-gateway-2
