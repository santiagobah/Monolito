global
    log /dev/log local0

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    timeout connect 5000ms
    timeout client  50000ms
    timeout server  50000ms

frontend http_in
    bind *:80
    default_backend nginx_replicas

backend nginx_replicas
    balance roundrobin
    server nginx1 nginx-gateway-1:80 check
    server nginx2 nginx-gateway-2:80 check
