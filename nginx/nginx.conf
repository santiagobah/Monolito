events {}

http {
    upstream nodos_pool {
        server nodos:8080 max_fails=3 fail_timeout=30s;
    }

    upstream enlaces_pool {
        server enlaces:8080 max_fails=3 fail_timeout=30s;
    }

    upstream envios_pool {
        least_conn;
        server envios_1:8080 max_fails=3 fail_timeout=30s;
        server envios_2:8080 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 8000;

        location /nodos {
            proxy_pass http://nodos_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /enlaces {
            proxy_pass http://enlaces_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /envios {
            proxy_pass http://envios_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /heartbeat {
            add_header Content-Type text/plain;
            return 200 "nginx gateway alive";
        }
    }
}